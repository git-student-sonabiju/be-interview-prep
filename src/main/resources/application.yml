spring:
  application:
    name: be-interview-prep
  datasource:
    url: jdbc:h2:mem:interview;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 100
  h2:
    console:
      enabled: true
app:
  jwt:
    secret: ${JWT_SECRET}
    ttl: 15m
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
